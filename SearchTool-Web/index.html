<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Search Tool</title>
  <link href="style/style.css" rel="stylesheet" type="text/css" />
  <!-- Simple inline favicon -->
  <link rel="icon" href="../images/favicon/optimized/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../images/favicon/optimized/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../images/favicon/optimized/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../images/favicon/optimized/favicon-180x180.png">
</head>
<body>

  <!-- Navigation Bar -->
  <nav>
    <h1 id="pageHeading">Challenge Technology Can Improve</h1>

    <!-- Dropdown List -->
    <div id="list-box">
      <label for="FactorSelect">Select a Challenge:</label>
      <select id="FactorSelect" onchange="updateTable()"></select>
    </div>
  </nav>

  <!-- Results Table -->
  <div id="searchToolInfo"></div>

  <!-- Expand & Collapse All Buttons -->
  <div class="buttons">
    <button onclick="expandAll()">Expand All</button>
    <button onclick="collapseAll()">Collapse All</button>
  </div>

  <!-- JavaScript Modules -->
  <script src="src/Extract.js"></script>
  <script src="src/Wrapper.js"></script>
  <script src="src/Factor.js"></script>
  <script src="src/Group.js"></script>
  <script src="src/SearchTool.js"></script>
  <script src="src/Controller.js"></script>
  <script src="src/toolJSON.js"></script>
  <script src="src/initSearchTool.js"></script>
  <!-- Footer -->
  <footer class="footer">
      <div class="footer-icons">
          <a href="mailto:nigel.galbraith@proton.me"
              aria-label="Email">
              <img src="../images/icons/optimized/email.png" alt="Email">
          </a>

          <a href="https://github.com/nigelgalbraith/"
              aria-label="GitHub"
              target="_blank"
              rel="noopener noreferrer">
              <img src="../images/icons/optimized/github.png" alt="GitHub">
          </a>

          <a href="https://www.linkedin.com/in/nigel-galbraith/"
              aria-label="LinkedIn"
              target="_blank"
              rel="noopener noreferrer">
              <img src="../images/icons/optimized/linkedin.png" alt="LinkedIn">
          </a>
      </div>

      <p>&copy; 2026 Nigel Galbraith</p>
  </footer>
</body>
</html>
